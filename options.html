<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>扩展设置</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        padding: 20px;
        color: #222;
      }
      @media (prefers-color-scheme: dark) {
        body { background-color: #1a1a1a; color: #eee; }
        input[type="url"] { background-color: #2a2a2a; color: #eee; border-color: #444; }
      }
      label {
        display: block;
        margin-bottom: 8px;
      }
      input[type="url"] {
        width: 100%;
        padding: 8px;
        box-sizing: border-box;
      }
      button {
        margin-top: 12px;
        padding: 8px 12px;
        cursor: pointer;
      }
      .note {
        margin-top: 16px;
        color: #666;
        line-height: 1.6;
      }
      @media (prefers-color-scheme: dark) {
        .note { color: #999; }
      }
    </style>
  </head>
  <body>
    <h1>扩展设置</h1>
    <form id="form">
      <label for="url">新标签页目标网址（留空则使用内置主页）：</label>
      <input
        id="url"
        type="url"
        placeholder="https://www.example.com"
      />
      <div>
        <button id="save">保存</button>
      </div>
    </form>
    <div class="note">
      <p>填写网址并保存后，新标签页将重定向到该网址。</p>
      <p>留空保存则恢复使用本扩展内置的自定义主页。</p>
    </div>
    <script src="options.js"></script>
  </body>
</html>
